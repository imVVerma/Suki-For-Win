<svg viewBox="0 0 1000 420" width="1000" height="420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="feat-bg-light" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F5EFE4" />
    </radialGradient>
    <linearGradient id="card-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FAF5ED" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#feat-bg-light)" stroke="#E5DCCE" stroke-width="1.5" />

  <!-- ================= ROW 1 ================= -->

  <!-- CARD 1: Tiny Native Rust Core -->
  <g transform="translate(30, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#315B45" fill-opacity="0.12" stroke="#315B45" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 37 28 L 31 38 L 36 38 L 33 46 L 43 36 L 38 36 Z" fill="#315B45" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">Tiny Native Rust Core</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      Built with Tauri v2 + Rust. Under 8 MB on disk and starts in milliseconds—over 50x lighter than bloated Electron apps.
    </text>

    <rect x="20" y="132" width="102" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="71" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#2B583E">~8 MB Footprint</text>
  </g>

  <!-- CARD 2: Free Forever (BYOK) -->
  <g transform="translate(350, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#B88A3D" fill-opacity="0.12" stroke="#B88A3D" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="34" r="5" stroke="#B88A3D" stroke-width="2" />
    <path d="M 38 37 L 44 43 M 41 40 L 44 37" stroke="#B88A3D" stroke-width="2" stroke-linecap="round" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">Free Forever (BYOK)</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      Zero monthly subscription fees or word caps. Plug in your free Groq API key (generous tier) and speak without limits.
    </text>

    <rect x="20" y="132" width="94" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="67" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#8C6421">$0 / mo (BYOK)</text>
  </g>

  <!-- CARD 3: Never Steals Focus -->
  <g transform="translate(670, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#315B45" fill-opacity="0.12" stroke="#315B45" stroke-opacity="0.3" stroke-width="1" />
    <rect x="27" y="32" width="20" height="10" rx="5" stroke="#315B45" stroke-width="1.8" />
    <circle cx="32" cy="37" r="1.5" fill="#315B45" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">Never Steals Window Focus</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      Win32 <tspan fill="#2B583E" font-weight="600">WS_EX_NOACTIVATE</tspan> ensures clicking Keep (✓) or Discard (✕) never blurs or unfocuses your editor.
    </text>

    <rect x="20" y="132" width="124" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="82" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#2B583E">Win32 Extended Hook</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- CARD 4: Hands-Free & Push-to-Talk -->
  <g transform="translate(30, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#A8722B" fill-opacity="0.12" stroke="#A8722B" stroke-opacity="0.3" stroke-width="1" />
    <rect x="33" y="27" width="8" height="12" rx="4" stroke="#A8722B" stroke-width="1.8" />
    <path d="M 29 33 C 29 39 45 39 45 33" stroke="#A8722B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="37" y1="39" x2="37" y2="44" stroke="#A8722B" stroke-width="1.8" stroke-linecap="round" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">Hands-Free or Hold Mode</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      Press <tspan font-family="Consolas" fill="#241E19" font-weight="600">Ctrl+Shift+Space</tspan> to speak hands-free, then press again to paste. Or switch to push-to-talk walkie-talkie mode.
    </text>

    <rect x="20" y="132" width="138" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="89" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#A8722B">Interactive Shortcut UI</text>
  </g>

  <!-- CARD 5: Context-Aware + Auto Fallback -->
  <g transform="translate(350, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#315B45" fill-opacity="0.12" stroke="#315B45" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 37 26 L 39 33 L 46 35 L 39 37 L 37 44 L 35 37 L 28 35 L 35 33 Z" fill="#315B45" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">Active App Context &amp; Tones</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      Per-App Tone Profiles match foreground windows (VS Code, Gmail, WhatsApp). Live dynamic model catalog with auto-fallback.
    </text>

    <rect x="20" y="132" width="130" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="85" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#2B583E">Llama 3.3 · Zero Downtime</text>
  </g>

  <!-- CARD 6: Local SQLite & Daily Digest -->
  <g transform="translate(670, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad-light)" stroke="#DDD2C1" stroke-width="1" />
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#B88A3D" fill-opacity="0.12" stroke="#B88A3D" stroke-opacity="0.3" stroke-width="1" />
    <ellipse cx="37" cy="30" rx="8" ry="3" stroke="#B88A3D" stroke-width="1.8" />
    <path d="M 29 30 V 37 C 29 39 33 40 37 40 C 41 40 45 39 45 37 V 30" stroke="#B88A3D" stroke-width="1.8" />
    <path d="M 29 37 V 44 C 29 46 33 47 37 47 C 41 47 45 46 45 44 V 37" stroke="#B88A3D" stroke-width="1.8" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#241E19">SQLite History &amp; Digest</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#5C5245">
      All dictations &amp; WPM metrics are saved locally in %APPDATA%. 1-click AI Daily Digest extracts action items and key topics.
    </text>

    <rect x="20" y="132" width="118" height="22" rx="11" fill="#F4ECE0" stroke="#DDD2C1" stroke-width="1" />
    <text x="79" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#8C6421">100% On-Device DB</text>
  </g>
</svg>
