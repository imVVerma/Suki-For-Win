<svg viewBox="0 0 1000 220" width="1000" height="220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="steps-bg-dark" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#201D19" />
      <stop offset="100%" stopColor="#14120F" />
    </radialGradient>
    <linearGradient id="step-card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#26211B" />
      <stop offset="100%" stopColor="#1D1915" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- Background -->
  <rect width="1000" height="220" rx="16" fill="url(#steps-bg-dark)" stroke="#332C24" stroke-width="1.5" />

  <!-- Connecting Flow Line -->
  <line x1="140" y1="110" x2="860" y2="110" stroke="#332C24" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- STEP 1: Launch Locally -->
  <g transform="translate(36, 26)">
    <rect width="220" height="168" rx="12" fill="url(#step-card-dark)" stroke="#3D342A" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#78A989" fill-opacity="0.15" stroke="#78A989" stroke-width="1" />
    <text x="32" y="37" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#78A989">01</text>
    <text x="56" y="36" class="font-sans" font-size="13.5" font-weight="600" fill="#F2E9DA">Clone &amp; Launch</text>

    <text x="18" y="72" class="font-sans" font-size="11.5" font-weight="400" fill="#C8BBA7">
      Run in dev mode or install the standalone Windows .exe:
    </text>

    <rect x="16" y="112" width="188" height="26" rx="6" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="26" y="129" class="font-mono" font-size="10.5" fill="#78A989">npm run tauri dev</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(260, 105)">
    <circle cx="6" cy="5" r="3" fill="#D9C18C" />
  </g>

  <!-- STEP 2: Paste Groq Key -->
  <g transform="translate(272, 26)">
    <rect width="220" height="168" rx="12" fill="url(#step-card-dark)" stroke="#3D342A" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#D9C18C" fill-opacity="0.15" stroke="#D9C18C" stroke-width="1" />
    <text x="32" y="37" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#D9C18C">02</text>
    <text x="56" y="36" class="font-sans" font-size="13.5" font-weight="600" fill="#F2E9DA">Paste Free Key</text>

    <text x="18" y="72" class="font-sans" font-size="11.5" font-weight="400" fill="#C8BBA7">
      Get a free Groq key and paste inside BYOK Settings:
    </text>

    <rect x="16" y="112" width="188" height="26" rx="6" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="26" y="129" class="font-mono" font-size="10.5" fill="#D9C18C">gsk_••••••••••••</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(496, 105)">
    <circle cx="6" cy="5" r="3" fill="#D6AB68" />
  </g>

  <!-- STEP 3: Trigger Shortcut -->
  <g transform="translate(508, 26)">
    <rect width="220" height="168" rx="12" fill="url(#step-card-dark)" stroke="#3D342A" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#D6AB68" fill-opacity="0.15" stroke="#D6AB68" stroke-width="1" />
    <text x="32" y="37" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#D6AB68">03</text>
    <text x="56" y="36" class="font-sans" font-size="13.5" font-weight="600" fill="#F2E9DA">Press Hotkey</text>

    <text x="18" y="72" class="font-sans" font-size="11.5" font-weight="400" fill="#C8BBA7">
      Press global shortcut anywhere inside any Windows app:
    </text>

    <rect x="16" y="112" width="188" height="26" rx="6" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="26" y="129" class="font-mono" font-size="10.5" fill="#D6AB68">Ctrl + Shift + Space</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <g transform="translate(732, 105)">
    <circle cx="6" cy="5" r="3" fill="#78A989" />
  </g>

  <!-- STEP 4: Speak & Auto-Paste -->
  <g transform="translate(744, 26)">
    <rect width="220" height="168" rx="12" fill="url(#step-card-dark)" stroke="#3D342A" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#78A989" fill-opacity="0.15" stroke="#78A989" stroke-width="1" />
    <text x="32" y="37" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#78A989">04</text>
    <text x="56" y="36" class="font-sans" font-size="13.5" font-weight="600" fill="#F2E9DA">Speak &amp; Paste</text>

    <text x="18" y="72" class="font-sans" font-size="11.5" font-weight="400" fill="#C8BBA7">
      Speak naturally. Hit hotkey or click ✓ to paste at cursor:
    </text>

    <rect x="16" y="112" width="188" height="26" rx="6" fill="#315B45" fill-opacity="0.25" stroke="#78A989" stroke-width="1" />
    <text x="26" y="129" class="font-sans" font-size="10.5" font-weight="600" fill="#78A989">✓ Formatted Text Pasted</text>
  </g>
</svg>
