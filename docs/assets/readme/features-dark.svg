<svg viewBox="0 0 1000 420" width="1000" height="420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="feat-bg-dark" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#201D19" />
      <stop offset="100%" stopColor="#14120F" />
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#26211B" />
      <stop offset="100%" stopColor="#1D1915" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#feat-bg-dark)" stroke="#332C24" stroke-width="1.5" />

  <!-- ================= ROW 1 ================= -->

  <!-- CARD 1: Tiny Native Rust Core -->
  <g transform="translate(30, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Zap / Rust Turbine -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#78A989" fill-opacity="0.15" stroke="#78A989" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 37 28 L 31 38 L 36 38 L 33 46 L 43 36 L 38 36 Z" fill="#78A989" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">Tiny Native Rust Core</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7" width="260">
      Built with Tauri v2 + Rust. Under 8 MB on disk and starts in milliseconds—over 50x lighter than bloated Electron apps.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="102" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="71" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#78A989">~8 MB Footprint</text>
  </g>

  <!-- CARD 2: Free Forever (BYOK) -->
  <g transform="translate(350, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Key -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#D9C18C" fill-opacity="0.15" stroke="#D9C18C" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="34" r="5" stroke="#D9C18C" stroke-width="2" />
    <path d="M 38 37 L 44 43 M 41 40 L 44 37" stroke="#D9C18C" stroke-width="2" stroke-linecap="round" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">Free Forever (BYOK)</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7">
      Zero monthly subscription fees or word caps. Plug in your free Groq API key (generous tier) and speak without limits.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="94" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="67" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#D9C18C">$0 / mo (BYOK)</text>
  </g>

  <!-- CARD 3: Never Steals Focus -->
  <g transform="translate(670, 25)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Window Pill -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#78A989" fill-opacity="0.15" stroke="#78A989" stroke-opacity="0.3" stroke-width="1" />
    <rect x="27" y="32" width="20" height="10" rx="5" stroke="#78A989" stroke-width="1.8" />
    <circle cx="32" cy="37" r="1.5" fill="#78A989" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">Never Steals Window Focus</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7">
      Win32 <tspan fill="#78A989">WS_EX_NOACTIVATE</tspan> ensures clicking Keep (✓) or Discard (✕) never blurs or unfocuses your editor.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="124" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="82" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#78A989">Win32 Extended Hook</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- CARD 4: Hands-Free & Push-to-Talk -->
  <g transform="translate(30, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Mic & Shortcut -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#D6AB68" fill-opacity="0.15" stroke="#D6AB68" stroke-opacity="0.3" stroke-width="1" />
    <rect x="33" y="27" width="8" height="12" rx="4" stroke="#D6AB68" stroke-width="1.8" />
    <path d="M 29 33 C 29 39 45 39 45 33" stroke="#D6AB68" stroke-width="1.8" stroke-linecap="round" />
    <line x1="37" y1="39" x2="37" y2="44" stroke="#D6AB68" stroke-width="1.8" stroke-linecap="round" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">Hands-Free or Hold Mode</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7">
      Press <tspan font-family="Consolas" fill="#F2E9DA">Ctrl+Shift+Space</tspan> to speak hands-free, then press again to paste. Or switch to push-to-talk walkie-talkie mode.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="138" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="89" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#D6AB68">Interactive Shortcut UI</text>
  </g>

  <!-- CARD 5: Context-Aware + Auto Fallback -->
  <g transform="translate(350, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Sparkles & App Title -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#78A989" fill-opacity="0.15" stroke="#78A989" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 37 26 L 39 33 L 46 35 L 39 37 L 37 44 L 35 37 L 28 35 L 35 33 Z" fill="#78A989" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">Active App Context &amp; Tones</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7">
      Per-App Tone Profiles match foreground windows (VS Code, Gmail, WhatsApp). Live dynamic model catalog with auto-fallback.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="130" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="85" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#78A989">Llama 3.3 · Zero Downtime</text>
  </g>

  <!-- CARD 6: Local SQLite & Daily Digest -->
  <g transform="translate(670, 220)">
    <rect width="300" height="175" rx="12" fill="url(#card-grad)" stroke="#3D342A" stroke-width="1" />
    <!-- Icon: Database / Analytics -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#D9C18C" fill-opacity="0.15" stroke="#D9C18C" stroke-opacity="0.3" stroke-width="1" />
    <ellipse cx="37" cy="30" rx="8" ry="3" stroke="#D9C18C" stroke-width="1.8" />
    <path d="M 29 30 V 37 C 29 39 33 40 37 40 C 41 40 45 39 45 37 V 30" stroke="#D9C18C" stroke-width="1.8" />
    <path d="M 29 37 V 44 C 29 46 33 47 37 47 C 41 47 45 46 45 44 V 37" stroke="#D9C18C" stroke-width="1.8" />

    <text x="64" y="42" class="font-sans" font-size="14.5" font-weight="600" fill="#F2E9DA">SQLite History &amp; Digest</text>
    <text x="20" y="80" class="font-sans" font-size="12" font-weight="400" fill="#C8BBA7">
      All dictations &amp; WPM metrics are saved locally in %APPDATA%. 1-click AI Daily Digest extracts action items and key topics.
    </text>

    <!-- Tag Badge -->
    <rect x="20" y="132" width="118" height="22" rx="11" fill="#171512" stroke="#40382F" stroke-width="1" />
    <text x="79" y="147" text-anchor="middle" class="font-mono" font-size="10" font-weight="500" fill="#D9C18C">100% On-Device DB</text>
  </g>
</svg>
