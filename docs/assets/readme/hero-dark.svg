<svg viewBox="0 0 1000 380" width="1000" height="380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#25201A" />
      <stop offset="55%" stopColor="#1C1814" />
      <stop offset="100%" stopColor="#14120F" />
    </radialGradient>
    <linearGradient id="hud-pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#78A989" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#40382F" />
      <stop offset="100%" stopColor="#D9C18C" stopOpacity="0.3" />
    </linearGradient>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F5ECE0" />
      <stop offset="50%" stopColor="#D9C18C" />
      <stop offset="100%" stopColor="#C99B52" />
    </linearGradient>
    <linearGradient id="logo-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8EC2A0" />
      <stop offset="100%" stopColor="#4A7B5E" />
    </linearGradient>
    <linearGradient id="logo-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D9C18C" />
      <stop offset="60%" stopColor="#D6AB68" />
      <stop offset="100%" stopColor="#BA7A32" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="380" rx="16" fill="url(#bg-glow)" stroke="#332C24" stroke-width="1.5" />

  <!-- Top Brand Header (Geometric Logo + Badge) -->
  <g transform="translate(482, 28)">
    <!-- Mini Braun S-Equalizer Icon (36x36 at center) -->
    <g transform="translate(-18, 0) scale(0.56)">
      <rect x="14" y="9" width="36" height="8.5" rx="4.25" fill="url(#logo-gold)" />
      <line x1="24" y1="11" x2="24" y2="15.5" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />
      <line x1="32" y1="11" x2="32" y2="15.5" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />
      <line x1="40" y1="11" x2="40" y2="15.5" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />

      <rect x="14" y="9" width="8.5" height="28" rx="4.25" fill="url(#logo-emerald)" />

      <rect x="14" y="27.75" width="36" height="8.5" rx="4.25" fill="url(#logo-amber)" />
      <line x1="24" y1="29.75" x2="24" y2="34.25" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />
      <line x1="32" y1="29.75" x2="32" y2="34.25" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
      <line x1="40" y1="29.75" x2="40" y2="34.25" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />

      <rect x="41.5" y="27.75" width="8.5" height="27.25" rx="4.25" fill="url(#logo-emerald)" />

      <rect x="14" y="46.5" width="36" height="8.5" rx="4.25" fill="url(#logo-gold)" />
      <line x1="24" y1="48.5" x2="24" y2="53" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />
      <line x1="32" y1="48.5" x2="32" y2="53" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />
      <line x1="40" y1="48.5" x2="40" y2="53" stroke="#171512" stroke-width="1.2" stroke-linecap="round" />

      <circle cx="45.5" cy="13.25" r="2.2" fill="#78A989" />
      <circle cx="18.25" cy="50.75" r="2.2" fill="#D6AB68" />
    </g>
  </g>

  <!-- Title & Headline -->
  <text x="500" y="98" text-anchor="middle" class="font-sans" font-size="28" font-weight="700" fill="#F2E9DA" letter-spacing="-0.5">Suki for Windows</text>
  <text x="500" y="126" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="400" fill="#C8BBA7">Free, private AI dictation &amp; workflow intelligence for every app on Windows 10 &amp; 11</text>

  <!-- Centerpiece: Floating HUD Pill Mockup -->
  <g transform="translate(270, 160)" filter="url(#shadow)">
    <!-- Pill Container -->
    <rect width="460" height="64" rx="32" fill="#201D19" stroke="url(#hud-pill-border)" stroke-width="1.5" />

    <!-- Pulsing Rec Dot + Timer -->
    <g transform="translate(24, 22)">
      <circle cx="10" cy="10" r="9" fill="#C98268" fill-opacity="0.2" />
      <circle cx="10" cy="10" r="5" fill="#C98268" />
      <text x="26" y="14" class="font-mono" font-size="13" font-weight="600" fill="#F2E9DA">04.2s</text>
    </g>

    <!-- 5 Animated Acoustic Equalizer Bars -->
    <g transform="translate(170, 18)">
      <rect x="0" y="8" width="4" height="12" rx="2" fill="#78A989" />
      <rect x="9" y="1" width="4" height="26" rx="2" fill="#D9C18C" />
      <rect x="18" y="5" width="4" height="18" rx="2" fill="#78A989" />
      <rect x="27" y="0" width="4" height="28" rx="2" fill="#D9C18C" />
      <rect x="36" y="6" width="4" height="16" rx="2" fill="#78A989" />
    </g>

    <!-- Active Window Context Badge inside HUD -->
    <g transform="translate(245, 20)">
      <rect width="112" height="24" rx="6" fill="#29241E" stroke="#40382F" stroke-width="1" />
      <text x="56" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="500" fill="#C8BBA7">VS Code Mode</text>
    </g>

    <!-- Action Buttons (✕ Discard & ✓ Keep) -->
    <g transform="translate(372, 14)">
      <!-- Discard Button -->
      <circle cx="18" cy="18" r="17" fill="#C98268" fill-opacity="0.12" stroke="#C98268" stroke-opacity="0.35" stroke-width="1" />
      <path d="M 13 13 L 23 23 M 23 13 L 13 23" stroke="#C98268" stroke-width="2" stroke-linecap="round" />

      <!-- Keep Button -->
      <circle cx="58" cy="18" r="17" fill="#315B45" stroke="#78A989" stroke-width="1.5" />
      <path d="M 52 18 L 56 22 L 64 14" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Non-Activating HUD Callout Tag -->
  <g transform="translate(500, 246)">
    <text x="0" y="0" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#948978">
      <tspan fill="#78A989">WS_EX_NOACTIVATE</tspan> — Floating pill never steals keyboard focus from your target window
    </text>
  </g>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(130, 296)">
    <!-- Badge 1: Windows 10/11 -->
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#201D19" stroke="#40382F" stroke-width="1" />
    <circle cx="16" cy="16" r="3.5" fill="#78A989" />
    <text x="28" y="20" class="font-sans" font-size="11" font-weight="500" fill="#F2E9DA">Windows 10 &amp; 11 (x64)</text>

    <!-- Badge 2: Tauri v2 + Rust -->
    <rect x="182" y="0" width="170" height="32" rx="16" fill="#201D19" stroke="#40382F" stroke-width="1" />
    <circle cx="198" cy="16" r="3.5" fill="#D9C18C" />
    <text x="210" y="20" class="font-sans" font-size="11" font-weight="500" fill="#F2E9DA">Tauri v2 + Rust (~8 MB)</text>

    <!-- Badge 3: In-Memory RAM Audio -->
    <rect x="366" y="0" width="186" height="32" rx="16" fill="#201D19" stroke="#40382F" stroke-width="1" />
    <circle cx="382" cy="16" r="3.5" fill="#78A989" />
    <text x="394" y="20" class="font-sans" font-size="11" font-weight="500" fill="#F2E9DA">Zero-Disk RAM Audio (cpal)</text>

    <!-- Badge 4: $0 Forever BYOK -->
    <rect x="566" y="0" width="174" height="32" rx="16" fill="#201D19" stroke="#40382F" stroke-width="1" />
    <circle cx="582" cy="16" r="3.5" fill="#D6AB68" />
    <text x="594" y="20" class="font-sans" font-size="11" font-weight="500" fill="#F2E9DA">100% Free Forever (BYOK)</text>
  </g>
</svg>
